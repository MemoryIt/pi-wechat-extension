name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # 自托管 runner 的标签为 `docker`（全局 runner "portainer-dind"）
    runs-on: bun-debian
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Check Bun
        run: bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Typecheck
        run: bun run typecheck
